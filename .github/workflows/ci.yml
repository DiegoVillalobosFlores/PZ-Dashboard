name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc -p tsconfig.json --noEmit
        working-directory: apps/server
      - run: bunx tsc -p tsconfig.json --noEmit
        working-directory: apps/browser
      - run: bun run build
        working-directory: apps/server
      - run: bun run build
        working-directory: apps/browser
